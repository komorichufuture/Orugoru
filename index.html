<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Piano v2 (3 Octaves)</title>
<style>
  :root{
    --bg:#0b0f14;
    --white:#f5f5f5;
    --black:#101318;
    --accent:#4da3ff;
    --text:#e8eef6;
    --muted:#9fb0c7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
    touch-action:manipulation;
  }
  header{
    padding:10px 12px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:15px;
    font-weight:700;
  }
  header p{
    margin:6px 0 0;
    font-size:12px;
    color:var(--muted);
  }

  .piano{
    width:100vw;
    margin:0 auto;
    padding:10px 10px 16px;
  }

  /* 3オクターブ（白鍵21本）を画面内に収める */
  .white-keys{
    position:relative;
    display:grid;
    grid-template-columns:repeat(21, 1fr);
    gap:3px;
    height:72vh;
    min-height:360px;
    max-width:980px;       /* PCで無駄に広がりすぎ防止 */
    margin:0 auto;
  }

  .white{
    background:var(--white);
    border-radius:10px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    font-size:10px;
    color:#000;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .white:active{
    background:var(--accent);
    color:#fff;
  }

  /* 黒鍵は白鍵の上に重ねる */
  .black-layer{
    position:absolute;
    left:0; right:0; top:0;
    height:58%;
    pointer-events:none;
  }
  .black{
    position:absolute;
    height:100%;
    background:var(--black);
    border-radius:10px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    font-size:9px;
    color:#fff;
    user-select:none;
    pointer-events:auto;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 10px 20px rgba(0,0,0,.35);
  }
  .black:active{ background:var(--accent); }

  @media (max-width:420px){
    .white{ font-size:9px; padding-bottom:6px; }
    .black{ font-size:8px; padding-bottom:6px; border-radius:9px; }
    .white-keys{ gap:2px; }
  }
</style>
</head>
<body>
<header>
  <h1>Tap to Play (3 Octaves)</h1>
  <p>C3〜B5（白鍵21 / 黒鍵15）</p>
</header>

<div class="piano">
  <div class="white-keys" id="whiteKeys">
    <div class="black-layer" id="blackLayer"></div>
  </div>
</div>

<!-- ↓ここは実ファイル名に合わせて！ app.js か apps.js -->
<script src="app.js"></script>
</body>
</html>

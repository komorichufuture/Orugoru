<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Box Keyboard</title>

<style>
  :root{
    --bg:#0b0f14;
    --panel:#0f1622;
    --white:#f5f5f5;
    --black:#101318;
    --accent:#4da3ff;
    --text:#e8eef6;
    --muted:#9fb0c7;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
    touch-action:manipulation;
  }
  header{
    padding:10px 12px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:15px;
    font-weight:700;
  }
  header p{
    margin:6px 0 0;
    font-size:12px;
    color:var(--muted);
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:6px 0 8px;
  }
  button{
    background:var(--panel);
    color:var(--text);
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
  }
  button:active{ background:var(--accent); }

  .wrap{
    width:min(760px, 100vw);
    margin:0 auto;
    padding:8px 10px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .row{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:10px;
  }
  .row-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 8px;
    font-size:12px;
    color:var(--muted);
  }

  .kbd{
    position:relative;
    display:grid;
    grid-template-columns:repeat(14, 1fr);
    gap:4px;
    border-radius:12px;
    overflow:hidden;
  }
  /* A案：スマホ縦最適（下段主役） */
  .kbd.low{ height:34vh; min-height:220px; }
  .kbd.high{ height:26vh; min-height:180px; }

  .white{
    background:var(--white);
    border-radius:10px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    font-size:10px;
    color:#000;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .white:active{ background:var(--accent); color:#fff; }

  .black-layer{
    position:absolute;
    left:0; right:0; top:0;
    height:58%;
    pointer-events:none;
  }
  .black{
    position:absolute;
    height:100%;
    background:var(--black);
    border-radius:10px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    font-size:9px;
    color:#fff;
    user-select:none;
    pointer-events:auto;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 10px 20px rgba(0,0,0,.35);
  }
  .black:active{ background:var(--accent); }

  @media (max-width:420px){
    .kbd{ gap:3px; }
    .white{ font-size:9px; padding-bottom:6px; }
    .black{ font-size:8px; padding-bottom:6px; }
  }
</style>
</head>

<body>
<header>
  <h1>Music Box Keyboard</h1>
  <p>上段 C5–B6 / 下段 C4–B5（JSON再生対応）</p>
</header>

<div class="controls">
  <button id="loadJson">Load JSON</button>
  <button id="playJson">▶ Play</button>
  <button id="stopJson">■ Stop</button>

  <!-- Recording UI -->
  <button id="recToggle">● Rec</button>
  <button id="downloadRec">⬇ JSON</button>
</div>

<input type="file" id="jsonFile" accept=".json" style="display:none">

<div class="wrap">
  <section class="row">
    <div class="row-title"><span>High</span><span>C5–B6</span></div>
    <div class="kbd high" id="kbdHigh">
      <div class="black-layer" id="blackHigh"></div>
    </div>
  </section>

  <section class="row">
    <div class="row-title"><span>Low</span><span>C4–B5</span></div>
    <div class="kbd low" id="kbdLow">
      <div class="black-layer" id="blackLow"></div>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
